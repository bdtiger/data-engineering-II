- hosts: rayhead
  become: false
  tasks:
    - name: Stop any existing Ray instance
      shell: ray stop --force
      ignore_errors: yes

    - name: Start Ray head
      shell: "ray start --head --port=6379 --node-ip-address={{ hostvars['rayhead']['ansible_host'] }} --dashboard-host=0.0.0.0"

    - name: Wait for head to be ready
      pause:
        seconds: 5

- hosts: rayworker2
  become: false
  tasks:
    - name: Stop any existing Ray instance
      shell: ray stop
      ignore_errors: yes

    - name: Connect worker 2 to head
      shell: "ray start --node-ip-address={{ hostvars['rayworker2']['ansible_host'] }} --address='{{ hostvars['rayhead']['ansible_host'] }}:6379'"

    - name: Wait for worker 2 to connect
      pause:
        seconds: 5

- hosts: rayhead
  become: false
  tasks:
    - name: Verify cluster has 2 nodes
      shell: "ray status --address={{ hostvars['rayhead']['ansible_host'] }}:6379"
      register: ray_status

    - name: Print cluster status
      debug:
        msg: "{{ ray_status.stdout }}"
